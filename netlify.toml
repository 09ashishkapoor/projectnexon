[build]
  # No build command needed for simple static site
  command = ""
  # Publish the root directory
  publish = "."
  # Directory containing Netlify Functions
  functions = "netlify/functions"

# Redirect rule for the subscribe function
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Scheduled function configuration
[functions]
  [functions.sendReminders]
    # Run daily at 5:00 AM UTC (Adjust as needed)
    schedule = "0 5 * * *"
# Scheduled function configuration (Placeholder)
# Uncomment and adjust cron schedule when sendReminders function is ready
# [functions]
#   [functions.sendReminders]
#     # Example: Run daily at 5:00 AM UTC
#     schedule = "0 5 * * *"

# Security headers
[[headers]]
for = "/*"
[headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.google.com/recaptcha/; connect-src 'self'; img-src 'self' data:; font-src 'self';"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
