[build]
  command = "npm run test:ci"  # Run CI-specific tests before deployment
  publish = "."
  functions = "netlify/functions"

# Function configuration
[functions]
  # Include external_node_modules to ensure proper packaging
  external_node_modules = ["firebase-admin"]
  node_bundler = "esbuild"
  
  # Note: Schedules are now defined directly within each function file
  # using exports.config = { schedule: "cron-expression" }

# Redirect and rewrite rules
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.google.com/recaptcha/; connect-src 'self' /.netlify/functions/ https://www.google.com/recaptcha/api2/ https://www.gstatic.com/recaptcha/; img-src 'self' data:; font-src 'self'; frame-ancestors 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"