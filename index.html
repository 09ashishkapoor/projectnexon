<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tithi Reminders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Subscribe to Tithi Reminders</h1>
        <p>Select the Tithis you want to receive email reminders for (2 days in advance).</p>

        <form id="subscription-form">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Honeypot field (hidden from users) -->
            <div style="display:none;">
                <label for="website">Website (leave blank):</label>
                <input type="text" id="website" name="website" autocomplete="off">
            </div>
        
            <footer style="text-align:center; margin-top:30px; font-size:0.9em;">
              <a href="PRIVACY.md" target="_blank" style="color:#ff3b3b;">Privacy Policy</a>
            </footer>

            <div class="form-group">
                <label for="year-select">Select Year:</label>
                <select id="year-select"></select>
            </div>

            <div class="form-group">
                <label>Select Tithis:</label>
                <div id="tithi-checkboxes" class="tithi-grid">
                    <!-- Tithi checkboxes will be loaded here by script.js -->
                    <p>Loading Tithis...</p>
                </div>
                <small>Check at least one Tithi.</small>
            </div>

            <div class="form-group">
                <button type="submit" id="submit-button">Subscribe</button>
            </div>
        </form>

        <div id="message-area" class="message-area"></div>
    </div>

    <!-- Replace 'your_site_key' with your actual reCAPTCHA site key -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LdohQsrAAAAAKUe4KxI-3Jf2hxYREvgqeD9ZZUo"></script>
    <script src="script.js"></script>
</body>
</html>
